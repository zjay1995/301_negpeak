# WPEAK64 sample method for the GC301c synthetic demo run.
# Detector settings mirror the legacy Detector dialog; components mirror
# the Edit Components table (retention time + window + response factor).

[detector]
segment_width=4
nandb_time=2
nandb_len=10
min_height=20
min_area=0
peak_alg=0
detect_meth=0
known_peaks=0
data_rate=10
analysis_time=120

[component]
name=Benzene
rt=40
window=5
response=0.005

[component]
name=Toluene
rt=60
window=5
response=0.008

[component]
name=Xylene
rt=105
window=5
response=0.012
