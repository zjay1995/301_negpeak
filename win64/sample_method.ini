# WPEAK64 sample method for the GC301c synthetic demo run.
# Detector settings mirror the legacy Detector dialog; components mirror
# the Edit Components table (retention time + window + response factor).

[detector]
segment_width=4
nandb_time=2
nandb_len=10
min_height=20
min_area=0
peak_alg=0
detect_meth=0
known_peaks=0
data_rate=10
analysis_time=120

# std1..std8 = concentrations of the calibration standards (used by
# "wpeak64_acq cal -s N" together with a calibration file)
[component]
name=Benzene
rt=40
window=5
response=0.005
std1=1.0
std2=2.0

[component]
name=Toluene
rt=60
window=5
response=0.008
std1=1.0
std2=2.0

[component]
name=Xylene
rt=105
window=5
response=0.012
std1=1.0
std2=2.0

# ---- instrument hardware (wpeak64_acq) --------------------------------------
# backend=ads1115 : ADS1115 ADC on Linux i2c-dev + GPIO control lines
# backend=sim     : simulated instrument (works on Windows and Linux)
[hardware]
backend=sim
i2c_dev=/dev/i2c-1
i2c_addr=0x48
adc_channel=0
pga_mv=2048
sps=128
gpio_chip=/dev/gpiochip0
sample_valve=17
inject_valve=27
cal_valve=22
purge_valve=23
pump=5
lamp=25
fan=6

# temperature = scale * volts + offset (LM35: scale=100 offset=0)
[tempzone]
name=oven
adc_channel=1
heater_line=24
setpoint=60
hysteresis=2
scale=100
offset=0

[timing]
equil_time=5
sample_time=10
inject_time=5
purge_time=10
